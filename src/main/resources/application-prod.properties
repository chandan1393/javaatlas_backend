# =====================================================================
# The live site: https://javaatlas.com
# Activated with SPRING_PROFILES_ACTIVE=prod (set in the Docker image and docker-compose.yml).
# Secrets always come from environment variables, never from this file.
# =====================================================================

# No defaults on purpose: the app won't start without real database settings.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

app.site-url=${APP_SITE_URL:https://javaatlas.com}
# Only needed when the website and API are on different domains (for example Vercel + Railway).
app.cors-origins=${APP_CORS_ORIGINS:https://javaatlas.com,https://www.javaatlas.com}
# HTTPS only. The API refuses to start in production without JWT_SECRET, a strong DB password and an https site URL.
app.cookie-secure=${COOKIE_SECURE:true}
app.mail-from=${MAIL_FROM:JavaAtlas <admin@javaatlas.com>}
# No demo courses on the live site: create your courses in Admin → New course.
app.seed-courses=${SEED_COURSES:false}

# Finish requests in progress before shutting down (smooth redeploys).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoint.health.probes.enabled=true

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
