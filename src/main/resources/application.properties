# =====================================================================
# JavaAtlas API: settings shared by every environment.
#
# Profiles:
#   dev  (default)  local development: application-dev.properties
#   prod            the live site:      application-prod.properties
# Choose one with SPRING_PROFILES_ACTIVE=prod (the Docker image does this for you).
# Any ${NAME:default} value can be overridden with an environment variable of that NAME.
# =====================================================================
spring.application.name=javaatlas
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Database (PostgreSQL) ----------
spring.jpa.open-in-view=false
# Tables are created by schema.sql (CREATE TABLE IF NOT EXISTS), so this is safe on every start.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
# Loads course sections and lectures in a few queries instead of N+1.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Runtime ----------
spring.threads.virtual.enabled=true
# Long enough for streamed AI answers.
spring.mvc.async.request-timeout=120s
spring.web.resources.cache.cachecontrol.max-age=1h

# ---------- Email (password resets and feedback notifications) ----------
# Without SPRING_MAIL_HOST, reset links are only written to the log (fine for development).
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---------- Web server ----------
server.port=${PORT:8080}
# Trust X-Forwarded-* headers from the reverse proxy (Caddy, Nginx, Railway), so client IPs and https are right.
server.forward-headers-strategy=native
server.compression.enabled=true
# Never send stack traces or exception details to browsers.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ---------- Health check (only /actuator/health is exposed, and not through the website) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# A slow mail server shouldn't mark the app unhealthy.
management.health.mail.enabled=false

# ---------- JavaAtlas ----------
# The owner's admin account. It signs in at /admin/login with a password and an authenticator-app code.
app.admin.email=${ADMIN_EMAIL:admin@javaatlas.com}
# Creates the admin account on first start (12+ characters). Remove it after your first sign-in.
app.admin.password=${ADMIN_PASSWORD:}
# true = reset the admin password to ADMIN_PASSWORD and clear two-factor sign-in on start (recovery).
app.admin.password-reset=${ADMIN_PASSWORD_RESET:false}
app.admin.require2fa=${ADMIN_REQUIRE_2FA:true}
app.admin.session-hours=${ADMIN_SESSION_HOURS:8}
# Optional: only these IPs or ranges can reach the admin API, e.g. 203.0.113.7,198.51.100.0/24.
app.admin.allowed-ips=${ADMIN_ALLOWED_IPS:}

# 32+ random characters (openssl rand -base64 48). Required in production.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=7d

# Days and hours in the admin analytics are counted in this time zone.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
# Email ADMIN_EMAIL about each new feedback message (needs the email settings above).
app.feedback-notify=${FEEDBACK_NOTIFY:true}

# Bunny Stream video hosting (optional): library ID and API key for uploads, token key for signed playback.
app.video.bunny-library-id=${BUNNY_STREAM_LIBRARY_ID:}
app.video.bunny-api-key=${BUNNY_STREAM_API_KEY:}
app.video.bunny-token-key=${BUNNY_STREAM_TOKEN_KEY:}
app.video.token-ttl-minutes=${VIDEO_TOKEN_TTL_MINUTES:30}

# Razorpay payments (test keys rzp_test_… locally, live keys rzp_live_… in production).
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# AI tutor and AI Lab (empty key = AI features hidden on the website).
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
app.ai.max-tokens=800
app.ai.per-ip-per-hour=${AI_PER_IP_PER_HOUR:30}
app.ai.daily-limit=${AI_DAILY_LIMIT:2000}
